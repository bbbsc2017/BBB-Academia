name: E2E

permissions:
  contents: read

# End-to-end UI acceptance suite (apps/e2e). It boots a full LearnHouse
# self-host via the LearnHouse CLI — pulling the PUBLISHED app image — and
# drives the UI with Playwright across every feature module under
# apps/e2e/features/.
#
# NIGHTLY SCHEDULE DISABLED (2026-09-05): "the published app image" here
# means ghcr.io/learnhouse/app from the upstream learnhouse/learnhouse
# project (see apps/cli/src/services/version-check.ts's resolveAppImage) —
# NOT an image built from this fork. This fork (bbbsc2017/BBB-Academia)
# never publishes its own image anywhere the CLI can pull, so this suite has
# never actually tested bbbacademia.com's real, customized behavior (e.g.
# the optional-due-date checkbox, Bold payments) — it tests vanilla upstream
# LearnHouse against THIS fork's fork-specific test specs, which fail there
# by design (the feature they test doesn't exist upstream). The nightly
# failures were consistently false alarms, not real regressions.
#
# Re-enabling the schedule only becomes meaningful once this fork publishes
# its own image (e.g. push the Dockerfile build to ghcr.io under this repo)
# and the CLI/E2E setup is pointed at that instead — tracked as a future
# infra task, not done here. workflow_dispatch is kept so it can still be
# run manually against upstream if ever useful for comparison.
on:
  workflow_dispatch:

jobs:
  e2e:
    name: E2E (self-host acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Build the CLI from this repo so the suite installs the self-host with
      # the current CLI (it still pulls the published app image).
      - name: Build CLI
        working-directory: apps/cli
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Install E2E deps
        working-directory: apps/e2e
        run: bun install

      - name: Install Playwright Chromium
        working-directory: apps/e2e
        run: bunx playwright install --with-deps chromium

      # SCORM is excluded here: every spec in features/scorm documents itself
      # as "Requires Enterprise Edition — run against a `dev --ee` / EE stack"
      # (see e.g. features/scorm/tests/01-import-and-track.spec.ts). This
      # workflow installs the plain published OSS image via the CLI with no
      # `--ee` flag and no `ee/` package present, so the backend never mounts
      # `/scorm/*` at all (see apps/api/src/core/ee_hooks.py — SCORM's router
      # only registers through register_ee_routers, unlike payments which was
      # migrated to be a first-class OSS module). Running those specs here
      # isn't a flaky/fixable test — the feature is structurally absent from
      # this build, so they'd 404 on their very first request every time.
      - name: Run E2E suite (OSS feature modules)
        working-directory: apps/e2e
        env:
          E2E_CLI: node ${{ github.workspace }}/apps/cli/dist/bin/learnhouse.js
          E2E_ADMIN_PASSWORD: E2eTestAdmin!234
          E2E_PORT: '8080'
        run: bun run test features/assignments features/payments

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7

      - name: Upload traces & videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/e2e/test-results/
          retention-days: 7
