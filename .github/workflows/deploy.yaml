name: Deploy to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy /courses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ vars.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync source to VPS
        run: |
          rsync -az --delete \
            --exclude='.git' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./ "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:~/bbb-academia-deploy/code/"

      - name: Build image and redeploy
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" '
            set -e
            cd ~/bbb-academia-deploy/code
            sudo docker build --build-arg NEXT_PUBLIC_BASE_PATH=/courses -t bbbacademia-courses:latest .
            sudo docker compose \
              --project-directory /root/.learnhouse/bbbacademia-courses \
              -f /root/.learnhouse/bbbacademia-courses/docker-compose.yml \
              up -d
          '

      - name: Health check
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" '
            for i in $(seq 1 15); do
              if curl -sf http://127.0.0.1:8080/courses/api/v1/health > /dev/null; then
                echo "Health check passed"
                exit 0
              fi
              echo "Waiting for app to become healthy... ($i/15)"
              sleep 5
            done
            echo "Health check FAILED"
            sudo docker logs --tail 100 learnhouse-courses-app
            exit 1
          '
